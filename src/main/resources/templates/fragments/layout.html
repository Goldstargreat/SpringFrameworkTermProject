<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 모든 화면 위쪽에 공통으로 들어가는 머리말 조각 -->
<!-- 다른 화면에서 th:replace="~{fragments/layout :: header}" 로 불러 쓴다 -->
<header th:fragment="header" class="site-header">
    <div class="header-inner">
        <a class="logo" th:href="@{/}">⭐ 골드스타몰</a>

        <!-- 상품 검색 -->
        <form class="search-form" th:action="@{/}" method="get">
            <input type="text" name="keyword" placeholder="찾고 싶은 상품을 검색해 보세요">
            <button type="submit">검색</button>
        </form>

        <nav class="header-nav">
            <!-- 로그인하지 않았을 때 -->
            <th:block th:if="${session.loginMemberId == null}">
                <a th:href="@{/members/login}">로그인</a>
                <a th:href="@{/members/join}">회원가입</a>
            </th:block>

            <!-- 로그인했을 때 -->
            <th:block th:if="${session.loginMemberId != null}">
                <span class="hello" th:text="${session.loginMemberName} + '님'">홍길동님</span>
                <!-- 손님 등급 (LoginGradeAdvice 가 모든 화면에 넣어 준다. 관리자는 null 이라 안 보인다) -->
                <a th:if="${loginMemberGrade != null}" th:href="@{/members/mypage}"
                   class="grade-badge" th:classappend="'grade-' + ${loginMemberGrade.name()}"
                   th:text="${loginMemberGrade.label}">골드</a>
                <!-- 장바구니, 주문내역은 손님에게만 보인다 (관리자는 물건을 사지 않는다) -->
                <a th:if="${session.loginMemberRole != 'ADMIN'}" th:href="@{/cart}">장바구니</a>
                <a th:if="${session.loginMemberRole != 'ADMIN'}" th:href="@{/orders}">주문내역</a>
                <!-- 종 아이콘(bell-icon) : 알림이 오는 메뉴(손님 알림, 관리자 주문관리·리뷰/문의) 앞에 붙인다 -->
                <!-- 알림 : 내 문의 답변, 내 상품평 코멘트. 확인하지 않은 개수를 빨간 숫자로 (MemberNoticeAdvice) -->
                <a th:if="${myNoticeCount != null}" th:href="@{/notifications}" class="bell-link"><svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>알림<span
                        class="notice-count" th:if="${myNoticeCount > 0}" th:text="${myNoticeCount}">2</span></a>
                <a th:href="@{/members/mypage}">마이페이지</a>
                <!-- 관리자에게만 보이는 메뉴 -->
                <!-- 주문관리 : 처리 대기 반품 신청 개수를 빨간 숫자로 보여 준다 (AdminNoticeAdvice) -->
                <a th:if="${session.loginMemberRole == 'ADMIN'}" th:href="@{/admin/orders}" class="bell-link"><svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>주문관리<span
                        class="notice-count" th:if="${adminPendingReturns > 0}"
                        th:text="${adminPendingReturns}">1</span></a>
                <a th:if="${session.loginMemberRole == 'ADMIN'}" th:href="@{/admin/members}">회원관리</a>
                <a th:if="${session.loginMemberRole == 'ADMIN'}" th:href="@{/admin/products}">상품관리</a>
                <!-- 리뷰/문의 : 답변 대기 문의 + 코멘트 대기 상품평 개수를 빨간 숫자로 보여 준다 (AdminNoticeAdvice) -->
                <a th:if="${session.loginMemberRole == 'ADMIN'}" th:href="@{/admin/board}" class="bell-link"><svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>리뷰/문의<span
                        class="notice-count" th:if="${adminPendingInquiries + adminPendingReviews > 0}"
                        th:text="${adminPendingInquiries + adminPendingReviews}">3</span></a>
                <form class="logout-form" th:action="@{/members/logout}" method="post">
                    <button type="submit">로그아웃</button>
                </form>
            </th:block>
        </nav>
    </div>
</header>

<!-- 성공/오류 메시지를 보여 주는 조각 -->
<div th:fragment="messages">
    <div class="alert alert-success" th:if="${message != null}" th:text="${message}">성공 메시지</div>
    <div class="alert alert-error" th:if="${error != null}" th:text="${error}">오류 메시지</div>
</div>

<!-- 모든 화면 아래쪽에 공통으로 들어가는 꼬리말 조각 -->
<!-- 공통 자바스크립트(js/common.js)도 여기서 불러온다 : 모든 화면이 꼬리말을 쓰므로 한 번만 적으면 된다 -->
<!-- 꼬리말은 화면 맨 아래에 있으므로, 스크립트가 실행될 때는 위쪽 HTML 이 이미 다 만들어져 있다 -->
<footer th:fragment="footer" class="site-footer">
    <p>골드스타몰 · 프레임워크실습 기말 Term Project · Spring Boot + JPA + MySQL</p>
    <script th:src="@{/js/common.js}"></script>
</footer>

</body>
</html>
