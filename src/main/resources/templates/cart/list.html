<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>장바구니 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1>장바구니</h1>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <!-- 장바구니가 비었을 때 -->
    <div class="empty" th:if="${cartItems.isEmpty()}">
        <p>장바구니에 담긴 상품이 없습니다.</p>
        <a class="btn btn-primary" th:href="@{/}">상품 보러 가기</a>
    </div>

    <!-- 장바구니에 상품이 있을 때 -->
    <th:block th:if="${!cartItems.isEmpty()}">
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>상품</th>
                    <th>가격</th>
                    <th>수량</th>
                    <th>합계</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td>
                        <a th:href="@{/products/{id}(id=${item.product.id})}">
                            <span class="thumb">
                                <img th:src="@{/images/products/{id}.jpg(id=${item.product.id})}" th:alt="${item.product.name}" data-remove-on-error>
                                <span th:text="${item.product.icon}">📦</span>
                            </span>
                            <span th:text="${item.product.name}">상품명</span>
                        </a>
                    </td>
                    <td th:text="${#numbers.formatInteger(item.product.price, 1, 'COMMA')} + '원'">0원</td>
                    <td>
                        <!-- 수량 변경 폼 -->
                        <form th:action="@{/cart/{id}/update(id=${item.id})}" method="post" class="inline-form">
                            <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="qty-input">
                            <button type="submit" class="btn btn-small">변경</button>
                        </form>
                    </td>
                    <td><b th:text="${#numbers.formatInteger(item.totalPrice, 1, 'COMMA')} + '원'">0원</b></td>
                    <td>
                        <!-- 삭제 폼 -->
                        <form th:action="@{/cart/{id}/delete(id=${item.id})}" method="post" class="inline-form">
                            <button type="submit" class="btn btn-small btn-danger">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 금액 내역 : 등급 할인이 있으면 상품 금액과 할인 금액을 따로 보여 준다 -->
        <div class="price-breakdown" th:if="${discount > 0}">
            <div>상품 금액 <span th:text="${#numbers.formatInteger(originalPrice, 1, 'COMMA')} + '원'">0원</span></div>
            <div class="discount-line">
                <span th:text="${member.grade.label} + ' 등급 할인 (' + ${member.grade.discountRate} + '%)'">골드 등급 할인 (5%)</span>
                <span th:text="'-' + ${#numbers.formatInteger(discount, 1, 'COMMA')} + '원'">-0원</span>
            </div>
        </div>
        <p class="total-price">
            총 결제 금액: <b th:text="${#numbers.formatInteger(totalPrice, 1, 'COMMA')}">0</b>원
        </p>

        <!-- 주문서 : 받는 사람 정보는 회원 정보로 미리 채워 둔다 -->
        <div class="form-box form-box-wide">
            <h2>배송 정보</h2>
            <form th:action="@{/orders}" method="post">
                <label>받는 사람
                    <input type="text" name="receiverName" th:value="${member.name}" required>
                </label>
                <label>연락처
                    <input type="text" name="receiverPhone" th:value="${member.phone}" placeholder="010-0000-0000" required data-phone-format inputmode="numeric" maxlength="13">
                </label>
                <!-- 추가 배송지가 있을 때만 "어디로 보낼지" 고르는 버튼을 보여 준다 -->
                <!-- 버튼을 누르면 그 주소가 아래 배송지 칸에 채워진다 (data-fill-target : 채울 입력칸 id, 동작은 js/common.js) -->
                <div class="address-choice" th:if="${!#strings.isEmpty(member.secondAddress)}">
                    <label><input type="radio" name="addressChoice" th:value="${member.address}" checked
                                  data-fill-target="shippingAddress"> 기본 배송지
                        <small class="refund-note" th:text="${member.address}">주소</small></label>
                    <label><input type="radio" name="addressChoice" th:value="${member.secondAddress}"
                                  data-fill-target="shippingAddress"> 추가 배송지
                        <small class="refund-note" th:text="${member.secondAddress}">주소</small></label>
                </div>
                <!-- 추가 배송지가 없으면 마이페이지에서 등록할 수 있다고 알려 준다 -->
                <p class="guide" th:if="${#strings.isEmpty(member.secondAddress)}">
                    추가 배송지(회사, 부모님 댁 등)를 <a th:href="@{/members/mypage}">마이페이지</a>에 등록해 두면 여기서 골라 쓸 수 있습니다.
                </p>
                <label>배송지 주소
                    <!-- 회원의 기본 주소를 미리 채워 두지만, 다른 곳으로 보내려면 바꿔 쓰면 된다 -->
                    <input type="text" id="shippingAddress" name="shippingAddress" th:value="${member.address}" required>
                </label>
                <button type="submit" class="btn btn-primary btn-block">주문하기</button>
            </form>
        </div>
    </th:block>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
