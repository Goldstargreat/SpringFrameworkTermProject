<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문 상세 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1>주문 상세 <small th:text="'(주문번호 ' + ${order.id} + ')'">(주문번호 1)</small></h1>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <!-- 배송 상태 추적 막대 : 취소된 주문이 아닐 때만 보여 준다 -->
    <div class="tracking" th:if="${order.status.name() != 'CANCELED'}">
        <!-- stat.count 는 1부터 시작하는 반복 순번. 현재 단계 번호 이하이면 'done' 표시 -->
        <div class="tracking-step" th:each="stepName, stat : ${steps}"
             th:classappend="${stat.count <= order.status.step} ? 'done'">
            <div class="tracking-circle" th:text="${stat.count}">1</div>
            <div class="tracking-label" th:text="${stepName}">주문접수</div>
        </div>
    </div>

    <div class="alert alert-error" th:if="${order.status.name() == 'CANCELED'}">취소된 주문입니다.</div>

    <h2>주문 상품</h2>
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>상품</th>
                <th>주문 가격</th>
                <th>수량</th>
                <th>합계</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.orderItems}">
                <td>
                    <span class="thumb">
                        <img th:src="@{/images/products/{id}.jpg(id=${item.product.id})}" th:alt="${item.product.name}" data-remove-on-error>
                        <span th:text="${item.product.icon}">📦</span>
                    </span>
                    <span th:text="${item.product.name}">상품명</span>
                </td>
                <td th:text="${#numbers.formatInteger(item.orderPrice, 1, 'COMMA')} + '원'">0원</td>
                <td th:text="${item.quantity}">1</td>
                <td><b th:text="${#numbers.formatInteger(item.totalPrice, 1, 'COMMA')} + '원'">0원</b></td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="total-price">
        총 결제 금액: <b th:text="${#numbers.formatInteger(order.totalPrice, 1, 'COMMA')}">0</b>원
    </p>

    <h2>배송 정보</h2>
    <ul class="info-list">
        <li>주문일시: <span th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</span></li>
        <li>받는 사람: <span th:text="${order.receiverName}">홍길동</span></li>
        <li>연락처: <span th:text="${order.receiverPhone}">010-0000-0000</span></li>
        <li>배송지: <span th:text="${order.shippingAddress}">주소</span></li>
        <li>배송 상태: <b th:text="${order.status.label}">주문접수</b></li>
    </ul>

    <div class="button-row">
        <a class="btn" th:href="@{/orders}">주문내역으로</a>
        <!-- 주문접수 상태일 때만 취소 버튼이 보인다 -->
        <form th:if="${order.status.name() == 'ORDER_RECEIVED'}"
              th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" class="inline-form">
            <button type="submit" class="btn btn-danger">주문 취소</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
