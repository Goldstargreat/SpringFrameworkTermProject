<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문내역 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1>주문내역</h1>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="empty" th:if="${orders.isEmpty()}">
        <p>아직 주문한 내역이 없습니다.</p>
        <a class="btn btn-primary" th:href="@{/}">상품 보러 가기</a>
    </div>

    <div class="table-wrap" th:if="${!orders.isEmpty()}">
        <table class="table">
            <thead>
            <tr>
                <th>주문번호</th>
                <th>주문일시</th>
                <th>주문 상품</th>
                <th>결제 금액</th>
                <th>배송 상태</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.displayNumber}">20261124-0001</td>
                <td th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
                <td>
                    <!-- 첫 번째 상품 이름 + 나머지 개수 -->
                    <span th:text="${order.orderItems[0].product.name}">상품명</span>
                    <span th:if="${order.orderItems.size() > 1}"
                          th:text="'외 ' + ${order.orderItems.size() - 1} + '건'">외 1건</span>
                </td>
                <td th:text="${#numbers.formatInteger(order.totalPrice, 1, 'COMMA')} + '원'">0원</td>
                <td>
                    <span class="status" th:classappend="'status-' + ${order.status.name()}"
                          th:text="${order.status.label}">주문접수</span>
                    <div class="refund-note" th:if="${order.refunded}"
                         th:text="${#numbers.formatInteger(order.refundAmount, 1, 'COMMA')} + '원 환불완료'">0원 환불완료</div>
                </td>
                <td>
                    <a class="btn btn-small" th:href="@{/orders/{id}(id=${order.id})}">배송 조회</a>
                    <!-- 끝난 주문(배송완료, 주문취소, 주문거절)만 삭제 버튼이 보인다 -->
                    <form th:if="${order.status.finished}"
                          th:action="@{/orders/{id}/delete(id=${order.id})}" method="post" class="inline-form"
                          data-confirm="이 주문을 주문내역에서 삭제하시겠습니까? 삭제한 주문은 다시 볼 수 없습니다.">
                        <button type="submit" class="btn btn-small btn-danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
