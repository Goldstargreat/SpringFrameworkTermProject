<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 찾기 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="form-box">
        <h1>비밀번호 찾기</h1>
        <div th:replace="~{fragments/layout :: messages}"></div>

        <!-- 1단계 : 본인 확인. 통과하면 새 비밀번호를 정하는 화면으로 넘어간다 -->
        <!-- 비밀번호는 암호화(BCrypt)되어 저장되므로 원래 비밀번호를 보여 줄 수는 없다 -->
        <p class="guide">아이디, 이름, 전화번호를 확인한 뒤 새 비밀번호를 정할 수 있습니다.</p>
        <form th:action="@{/members/find-password}" method="post">
            <label>아이디
                <input type="text" name="loginId" th:value="${loginId}" required>
            </label>
            <label>이름
                <input type="text" name="name" th:value="${name}" required>
            </label>
            <label>전화번호
                <input type="text" name="phone" th:value="${phone}" placeholder="010-0000-0000" required data-phone-format inputmode="numeric" maxlength="13">
            </label>
            <button type="submit" class="btn btn-primary btn-block">본인 확인</button>
        </form>

        <p class="form-footer find-links">
            <a th:href="@{/members/login}">로그인</a>
            <span>|</span>
            <a th:href="@{/members/find-id}">아이디 찾기</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
