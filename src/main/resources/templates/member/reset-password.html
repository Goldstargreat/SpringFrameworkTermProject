<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 비밀번호 설정 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="form-box">
        <h1>새 비밀번호 설정</h1>
        <div th:replace="~{fragments/layout :: messages}"></div>

        <!-- 2단계 : 본인 확인을 통과한 경우에만 이 화면에 들어올 수 있다 (MemberController 참고) -->
        <p class="guide">본인 확인이 끝났습니다. 새로 사용할 비밀번호를 입력해 주세요.</p>
        <form th:action="@{/members/reset-password}" method="post">
            <label>새 비밀번호 (4글자 이상)
                <input type="password" name="newPassword" required>
            </label>
            <label>새 비밀번호 확인
                <input type="password" name="newPasswordConfirm" required>
            </label>
            <button type="submit" class="btn btn-primary btn-block">비밀번호 변경</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
