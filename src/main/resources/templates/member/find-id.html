<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아이디 찾기 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="form-box">
        <h1>아이디 찾기</h1>
        <div th:replace="~{fragments/layout :: messages}"></div>

        <!-- 찾은 경우 : 아이디 일부를 가려서 보여 준다 -->
        <th:block th:if="${foundLoginId != null}">
            <div class="found-id">
                회원님의 아이디는
                <b th:text="${foundLoginId}">gold****</b>
            </div>
            <a th:href="@{/members/login}" class="btn btn-primary btn-block">로그인하러 가기</a>
            <p class="form-footer find-links">
                <a th:href="@{/members/find-password}">비밀번호 찾기</a>
            </p>
        </th:block>

        <!-- 찾기 전 : 가입할 때 입력한 이름과 전화번호로 찾는다 -->
        <th:block th:if="${foundLoginId == null}">
            <p class="guide">가입할 때 입력한 이름과 전화번호를 입력해 주세요.</p>
            <form th:action="@{/members/find-id}" method="post">
                <label>이름
                    <input type="text" name="name" th:value="${name}" required>
                </label>
                <label>전화번호
                    <input type="text" name="phone" th:value="${phone}" placeholder="010-0000-0000" required data-phone-format inputmode="numeric" maxlength="13">
                </label>
                <button type="submit" class="btn btn-primary btn-block">아이디 찾기</button>
            </form>
            <p class="form-footer find-links">
                <a th:href="@{/members/login}">로그인</a>
                <span>|</span>
                <a th:href="@{/members/find-password}">비밀번호 찾기</a>
            </p>
        </th:block>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
