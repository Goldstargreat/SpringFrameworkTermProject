<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="form-box">
        <h1>회원가입</h1>
        <div th:replace="~{fragments/layout :: messages}"></div>

        <!-- 입력한 값은 POST /members/join 으로 전송된다 -->
        <form th:action="@{/members/join}" method="post">
            <label>아이디 (4글자 이상)
                <input type="text" name="loginId" th:value="${loginId}" required>
            </label>
            <label>비밀번호 (4글자 이상)
                <input type="password" name="password" required>
            </label>
            <label>비밀번호 확인
                <input type="password" name="passwordConfirm" required>
            </label>
            <label>이름
                <input type="text" name="name" th:value="${name}" required>
            </label>
            <label>전화번호
                <input type="text" name="phone" th:value="${phone}" placeholder="010-0000-0000" required data-phone-format inputmode="numeric" maxlength="13">
            </label>
            <label>기본 배송지 주소
                <input type="text" name="address" th:value="${address}" placeholder="주문할 때 자동으로 채워집니다">
            </label>
            <button type="submit" class="btn btn-primary btn-block">가입하기</button>
        </form>

        <p class="form-footer">이미 회원이신가요? <a th:href="@{/members/login}">로그인</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
