<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <!-- 카테고리 메뉴 -->
    <div class="category-bar">
        <a th:href="@{/}" th:classappend="${selectedCategory == null and keyword == null} ? 'active'">전체</a>
        <!-- categories 목록을 하나씩 꺼내 c 에 담으며 반복한다 -->
        <a th:each="c : ${categories}"
           th:href="@{/(category=${c})}"
           th:text="${c}"
           th:classappend="${c == selectedCategory} ? 'active'">카테고리</a>
    </div>

    <p class="search-result" th:if="${keyword != null and keyword != ''}">
        '<b th:text="${keyword}">검색어</b>' 검색 결과 <b th:text="${totalCount}">0</b>건
    </p>

    <p class="empty" th:if="${products.isEmpty()}">조건에 맞는 상품이 없습니다.</p>

    <!-- 상품 카드 목록 -->
    <div class="product-grid">
        <a class="product-card" th:each="p : ${products}" th:href="@{/products/{id}(id=${p.id})}">
            <!-- static/images/products/상품번호.jpg 파일이 있으면 사진을, 없으면 이모지를 보여 준다 -->
            <div class="product-icon">
                <img th:src="@{/images/products/{id}.jpg(id=${p.id})}" th:alt="${p.name}" data-remove-on-error>
                <span th:text="${p.icon}">📦</span>
            </div>
            <div class="product-category" th:text="${p.category}">카테고리</div>
            <div class="product-name" th:text="${p.name}">상품명</div>
            <div class="product-price">
                <b th:text="${#numbers.formatInteger(p.price, 1, 'COMMA')}">10,000</b>원
            </div>
            <div class="badge badge-soldout" th:if="${p.stock == 0}">품절</div>
            <!-- 1 ~ 2개 남았을 때만 남은 개수를 보여 준다 (Product.LOW_STOCK_LIMIT) -->
            <div class="badge badge-few" th:if="${p.lowStock}"
                 th:text="'품절 임박 ' + ${p.stock} + '개 남음'">품절 임박</div>
            <!-- 로켓 배송 : 관리자가 상품관리에서 켠 상품만 (품절이면 붙이지 않는다) -->
            <div class="badge badge-rocket" th:if="${p.showFastDelivery}">로켓 배송</div>
        </a>
    </div>

    <!-- 페이지 나누기 : 페이지가 2개 이상일 때만 보여 준다 -->
    <!-- pageLinkBase : 지금 보고 있는 카테고리/검색어가 붙은 링크 앞부분 (예: /?category=식품&page=) -->
    <!-- 뒤에 페이지 번호만 붙이면 되므로, 페이지를 넘겨도 조건이 유지된다 (HomeController 참고) -->
    <nav class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 1}" th:href="@{${pageLinkBase + (currentPage - 1)}}">&lsaquo; 이전</a>
        <span th:unless="${currentPage > 1}" class="disabled">&lsaquo; 이전</span>

        <th:block th:each="n : ${#numbers.sequence(startPage, endPage)}">
            <span th:if="${n == currentPage}" class="current" th:text="${n}">1</span>
            <a th:unless="${n == currentPage}" th:href="@{${pageLinkBase + n}}" th:text="${n}">2</a>
        </th:block>

        <a th:if="${currentPage < totalPages}" th:href="@{${pageLinkBase + (currentPage + 1)}}">다음 &rsaquo;</a>
        <span th:unless="${currentPage < totalPages}" class="disabled">다음 &rsaquo;</span>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
