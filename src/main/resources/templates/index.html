<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <!-- 카테고리 메뉴 -->
    <div class="category-bar">
        <a th:href="@{/}" th:classappend="${selectedCategory == null and keyword == null} ? 'active'">전체</a>
        <!-- categories 목록을 하나씩 꺼내 c 에 담으며 반복한다 -->
        <a th:each="c : ${categories}"
           th:href="@{/(category=${c})}"
           th:text="${c}"
           th:classappend="${c == selectedCategory} ? 'active'">카테고리</a>
    </div>

    <p class="search-result" th:if="${keyword != null and keyword != ''}">
        '<b th:text="${keyword}">검색어</b>' 검색 결과 <b th:text="${products.size()}">0</b>건
    </p>

    <p class="empty" th:if="${products.isEmpty()}">조건에 맞는 상품이 없습니다.</p>

    <!-- 상품 카드 목록 -->
    <div class="product-grid">
        <a class="product-card" th:each="p : ${products}" th:href="@{/products/{id}(id=${p.id})}">
            <!-- static/images/products/상품번호.jpg 파일이 있으면 사진을, 없으면 이모지를 보여 준다 -->
            <div class="product-icon">
                <img th:src="@{/images/products/{id}.jpg(id=${p.id})}" th:alt="${p.name}" onerror="this.remove()">
                <span th:text="${p.icon}">📦</span>
            </div>
            <div class="product-category" th:text="${p.category}">카테고리</div>
            <div class="product-name" th:text="${p.name}">상품명</div>
            <div class="product-price">
                <b th:text="${#numbers.formatInteger(p.price, 1, 'COMMA')}">10,000</b>원
            </div>
            <div class="badge badge-soldout" th:if="${p.stock == 0}">품절</div>
            <div class="badge badge-few" th:if="${p.stock > 0 and p.stock <= 5}"
                 th:text="'마감 임박 ' + ${p.stock} + '개 남음'">마감 임박</div>
            <div class="badge badge-rocket" th:if="${p.stock > 5}">내일 도착 보장</div>
        </a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
