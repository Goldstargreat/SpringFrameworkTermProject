<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>상품관리 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1>상품관리 <small>(관리자 전용)</small></h1>
    <p class="guide">가격이나 재고 숫자를 고친 뒤 그 줄의 '저장' 버튼을 누르세요. 재고를 0으로 하면 품절로 표시됩니다.</p>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <!-- 1. 상품 목록 : 줄마다 가격/재고 수정 폼이 하나씩 있다 -->
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>번호</th>
                <th>상품</th>
                <th>카테고리</th>
                <th>가격(원) / 재고(개)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.id}">1</td>
                <td>
                    <a th:href="@{/products/{id}(id=${p.id})}">
                        <span th:text="${p.icon}">📦</span>
                        <span th:text="${p.name}">상품명</span>
                    </a>
                </td>
                <td th:text="${p.category}">카테고리</td>
                <td>
                    <form th:action="@{/admin/products/{id}/update(id=${p.id})}" method="post" class="inline-form">
                        <input type="number" name="price" th:value="${p.price}" min="1" required class="price-input">
                        <input type="number" name="stock" th:value="${p.stock}" min="0" required class="qty-input">
                        <button type="submit" class="btn btn-small btn-primary">저장</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 2. 새 상품 등록 -->
    <div class="form-box form-box-wide">
        <h2>새 상품 등록</h2>
        <form th:action="@{/admin/products}" method="post">
            <label>상품명
                <input type="text" name="name" required>
            </label>
            <label>카테고리
                <select name="category" required>
                    <option value="">-- 선택 --</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">카테고리</option>
                </select>
            </label>
            <label>가격(원)
                <input type="number" name="price" min="1" required>
            </label>
            <label>재고(개)
                <input type="number" name="stock" min="0" value="0" required>
            </label>
            <label>상품 설명
                <input type="text" name="description">
            </label>
            <label>이모지 (사진이 없을 때 대신 보여 줄 그림, 비워 두면 📦)
                <input type="text" name="icon" placeholder="예) 🎁">
            </label>
            <button type="submit" class="btn btn-primary btn-block">상품 등록</button>
        </form>
        <p class="guide">등록한 상품의 사진은 static/images/products/상품번호.jpg 로 넣으면 보입니다.</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
