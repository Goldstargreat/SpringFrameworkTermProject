<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원관리 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1>회원관리 <small>(관리자 전용)</small></h1>
    <p class="guide">회원을 삭제하면 그 회원의 장바구니와 주문 내역도 함께 삭제됩니다. 배송 중인 주문이 있는 회원은 삭제할 수 없습니다.</p>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <!-- 회원 검색 : 검색 기준을 고르고 일부만 입력해도 된다 (예: 홍, gold, 5678) -->
    <form th:action="@{/admin/members}" method="get" class="inline-form member-search">
        <select name="type">
            <option value="all" th:selected="${type == 'all'}">전체</option>
            <option value="name" th:selected="${type == 'name'}">이름</option>
            <option value="loginId" th:selected="${type == 'loginId'}">아이디</option>
            <option value="phone" th:selected="${type == 'phone'}">전화번호</option>
        </select>
        <input type="text" name="keyword" th:value="${keyword}" placeholder="검색어 입력 (예: 홍길동, gold, 5678)">
        <button type="submit" class="btn btn-small btn-primary">검색</button>
        <a th:href="@{/admin/members}" class="btn btn-small">전체 보기</a>
    </form>

    <!-- 검색 기준 이름 : 전체는 따로 적지 않는다 -->
    <p class="search-result" th:if="${keyword != null and keyword != ''}">
        <th:block th:switch="${type}">
            <span th:case="'name'">이름 </span>
            <span th:case="'loginId'">아이디 </span>
            <span th:case="'phone'">전화번호 </span>
        </th:block>'<b th:text="${keyword}">검색어</b>' 검색 결과 <b th:text="${members.size()}">0</b>건
    </p>

    <p class="empty" th:if="${members.isEmpty()}">조건에 맞는 회원이 없습니다.</p>

    <div class="table-wrap" th:unless="${members.isEmpty()}">
        <table class="table">
            <thead>
            <tr>
                <!-- 순번 : 화면에만 1, 2, 3... 차례대로 붙이는 번호 (회원번호와 다르다) -->
                <th>순번</th>
                <!-- 회원번호 : DB 가 자동으로 붙이는 기본키. 삭제된 회원 번호는 다시 쓰지 않아서 중간이 비어 있을 수 있다 -->
                <th>회원번호</th>
                <th>아이디</th>
                <th>이름</th>
                <th>전화번호</th>
                <th>기본 배송지</th>
                <th>가입일시</th>
                <th>권한</th>
                <th>처리</th>
            </tr>
            </thead>
            <tbody>
            <!-- stat.count : th:each 가 몇 번째 줄인지 1부터 세어 준다 -->
            <tr th:each="m, stat : ${members}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${m.id}">1</td>
                <td th:text="${m.loginId}">hong</td>
                <td th:text="${m.name}">홍길동</td>
                <td th:text="${m.phone}">010-0000-0000</td>
                <td th:text="${m.address}">주소</td>
                <td th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
                <td th:text="${m.role == 'ADMIN'} ? '관리자' : '일반'">일반</td>
                <td>
                    <a th:href="@{/admin/members/{id}/edit(id=${m.id})}" class="btn btn-small btn-primary">수정</a>
                    <!-- 관리자 계정은 삭제 버튼을 보여 주지 않는다 -->
                    <form th:if="${m.role != 'ADMIN'}"
                          th:action="@{/admin/members/{id}/delete(id=${m.id})}" method="post" class="inline-form"
                          data-confirm="이 회원을 삭제하시겠습니까? 주문 내역도 함께 삭제됩니다.">
                        <button type="submit" class="btn btn-small btn-danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
