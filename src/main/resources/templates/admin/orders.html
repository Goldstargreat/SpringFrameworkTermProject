<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문관리 - 골드스타몰</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1>주문관리 <small>(관리자 전용)</small></h1>
    <p class="guide">버튼을 누르면 배송 상태가 한 단계씩 넘어갑니다: 주문접수 → 입고 → 출고 → 배송중 → 배송완료<br>
        출고 전(주문접수, 입고) 주문은 거절할 수 있습니다. 거절하면 결제 금액 전체가 환불되고 재고가 돌아오며, 거절 사유는 손님에게 보여집니다.</p>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <p class="empty" th:if="${orders.isEmpty()}">들어온 주문이 없습니다.</p>

    <div class="table-wrap" th:if="${!orders.isEmpty()}">
        <table class="table">
            <thead>
            <tr>
                <th>주문번호</th>
                <th>주문자</th>
                <th>주문일시</th>
                <th>배송지</th>
                <th>결제 금액</th>
                <th>배송 상태</th>
                <th>처리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">1</td>
                <td th:text="${order.member.name} + ' (' + ${order.member.loginId} + ')'">홍길동 (hong)</td>
                <td th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
                <td th:text="${order.shippingAddress}">주소</td>
                <td th:text="${#numbers.formatInteger(order.totalPrice, 1, 'COMMA')} + '원'">0원</td>
                <td>
                    <span class="status" th:classappend="'status-' + ${order.status.name()}"
                          th:text="${order.status.label}">주문접수</span>
                    <!-- 환불된 주문 : 환불 금액과 거절 사유 -->
                    <div class="refund-note" th:if="${order.refunded}"
                         th:text="${#numbers.formatInteger(order.refundAmount, 1, 'COMMA')} + '원 환불완료'">0원 환불완료</div>
                    <div class="refund-note" th:if="${order.rejectReason != null}"
                         th:text="'사유: ' + ${order.rejectReason}">사유</div>
                </td>
                <td>
                    <!-- 진행 중인 주문이면 '다음 단계' 버튼을 보여 준다 -->
                    <form th:if="${!order.status.finished}"
                          th:action="@{/admin/orders/{id}/next(id=${order.id})}" method="post" class="inline-form">
                        <button type="submit" class="btn btn-small btn-primary"
                                th:text="${order.status.next().label} + ' 처리'">입고 처리</button>
                    </form>
                    <!-- 출고 전 주문이면 '거절' : 사유를 적어야 하고, 누르면 환불된다 -->
                    <form th:if="${order.status.rejectable}"
                          th:action="@{/admin/orders/{id}/reject(id=${order.id})}" method="post" class="inline-form reject-form"
                          th:attr="data-confirm=${order.id} + '번 주문을 거절하고 ' + ${#numbers.formatInteger(order.totalPrice, 1, 'COMMA')} + '원을 환불하시겠습니까?'">
                        <input type="text" name="reason" maxlength="200" placeholder="거절 사유 (예: 재고 부족)" required>
                        <button type="submit" class="btn btn-small btn-danger">거절·환불</button>
                    </form>
                    <!-- 끝난 주문(배송완료, 주문취소, 주문거절)이면 '삭제' 버튼을 보여 준다 -->
                    <form th:if="${order.status.finished}"
                          th:action="@{/admin/orders/{id}/delete(id=${order.id})}" method="post" class="inline-form"
                          data-confirm="이 주문을 삭제하시겠습니까?">
                        <button type="submit" class="btn btn-small btn-danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
