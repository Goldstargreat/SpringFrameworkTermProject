spring.application.name = GoldstarMall

# JDBC
spring.datasource.url = jdbc:mysql://localhost:3306/goldstarmall?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = 1234
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

# Session
# 세션 번호는 쿠키로만 주고받는다 (주소 뒤에 ;jsessionid=... 를 붙이지 않는다)
# 붙이면 처음 로그인한 직후 이동하는 /;jsessionid=... 주소를 HomeController 가 받지 못해 메인 화면이 깨진다
server.servlet.session.tracking-modes = cookie
