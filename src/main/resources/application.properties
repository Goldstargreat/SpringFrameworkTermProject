# ===== 서버 설정 =====
server.port=8080

# ===== MySQL 접속 설정 =====
# createDatabaseIfNotExist=true : goldstarmall DB가 없으면 자동으로 생성한다
spring.datasource.url=jdbc:mysql://localhost:3306/goldstarmall?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 비밀번호는 여기 적지 않는다 : git 에 올리지 않는 application-local.properties 에 본인 MySQL root 비밀번호를 적는다
spring.datasource.password=
spring.config.import=optional:classpath:application-local.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA 설정 =====
# update : 엔티티를 기준으로 테이블을 자동으로 만들거나 수정한다, 기존 데이터는 유지된다
spring.jpa.hibernate.ddl-auto=update
# 실행되는 SQL을 콘솔에 보기 좋게 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 화면(Thymeleaf)에서도 연관된 엔티티를 꺼내 쓸 수 있게 유지
spring.jpa.open-in-view=true

# ===== Thymeleaf 설정 =====
# 서버를 재시작하지 않아도 수정한 HTML 화면이 바로 반영되도록 캐시 끄기
spring.thymeleaf.cache=false
